<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Language Guides</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --line: #e6e4df;
      --accent: #2c4a3e;
      --code-bg: #f0efe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      font-size: 17px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 246, 243, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .topbar a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .topbar a:hover { color: var(--text); }
    .brand { font-weight: 500; color: var(--text) !important; }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    @media (max-width: 640px) {
      article { padding: 24px 18px; }
      body { font-size: 16px; }
    }
    h1, h2, h3, h4 {
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 { font-size: 1.9rem; margin-top: 0; }
    h2 {
      font-size: 1.35rem;
      margin-top: 2.2em;
      padding-top: 0.6em;
      border-top: 1px solid var(--line);
    }
    h3 { font-size: 1.12rem; margin-top: 1.6em; }
    h4 { font-size: 1rem; margin-top: 1.3em; color: #333; }
    p, li { color: #222; }
    a { color: var(--accent); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 0.12em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: #1e1f1c;
      color: #f3f3ef;
      padding: 14px 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; color: inherit; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 0.92rem;
      display: block;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f3f2ed; font-weight: 600; }
    blockquote {
      margin: 1.2em 0;
      padding: 0.2em 0 0.2em 1em;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2em 0;
    }
    details {
      background: #fafaf7;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 1em 0;
    }
    summary { cursor: pointer; font-weight: 500; }
    .footer-nav {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Raman Ghimire</a>
      <nav>
        <a href="/language/">Language guides</a>
      </nav>
    </div>
  </header>
  <main>
    <article>
      {{ content }}
    </article>
    <div class="footer-nav">
      <a href="/language/">← All language guides</a>
      <a href="/">Home</a>
    </div>
  </main>
</body>
</html>
